<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Predicta — Sistema Inteligente de Monitoramento e Predição Acadêmica. Acompanhe indicadores institucionais, predições e estatísticas em tempo real." />
  <title>Predicta — SIMPA | Monitoramento Acadêmico</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@600;700;800&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css" />
</head>
<body>
  <div id="root">
    <div class="splash-screen" id="splash">
      <div class="splash-content">
        <img src="/assets/Simbolo - (SEM FUNDO).png" alt="Predicta" class="splash-symbol"
             onerror="this.style.display='none'" />
        <div class="splash-bar"><div class="splash-bar-fill"></div></div>
        <p class="splash-text">Carregando Predicta...</p>
      </div>
    </div>
  </div>

  <!-- React 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel (transpila JSX no browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- Serviços e utilitários -->
  <script type="text/babel" src="/assets/js/api.js"></script>
  <script type="text/babel" src="/assets/js/utils.js"></script>

  <!-- Componentes base -->
  <script type="text/babel" src="/assets/js/components/Sidebar.js"></script>
  <script type="text/babel" src="/assets/js/components/Header.js"></script>
  <script type="text/babel" src="/assets/js/components/KpiCard.js"></script>
  <script type="text/babel" src="/assets/js/components/LoadingState.js"></script>
  <script type="text/babel" src="/assets/js/components/EmptyState.js"></script>
  <script type="text/babel" src="/assets/js/components/InsightCard.js"></script>

  <!-- Páginas -->
  <script type="text/babel" src="/assets/js/pages/Dashboard.js"></script>
  <script type="text/babel" src="/assets/js/pages/Cursos.js"></script>
  <script type="text/babel" src="/assets/js/pages/Predicao.js"></script>
  <script type="text/babel" src="/assets/js/pages/Notas.js"></script>
  <script type="text/babel" src="/assets/js/pages/Estatisticas.js"></script>

  <!-- App principal -->
  <script type="text/babel" src="/assets/js/App.js"></script>
</body>
</html>
